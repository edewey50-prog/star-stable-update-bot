name: Check Star Stable Updates

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new Star Stable update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_updates.py

      - name: Save latest update
        run: |
          if [ -z "$(git status --porcelain -- last_update.txt)" ]; then
            echo "No state change to save."
            exit 0
          fi

          git config user.name "Star Stable Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_update.txt
          git commit -m "Update latest Star Stable article"
          git push
